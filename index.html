<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PDF / TXT Chatbot</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>PDF / TXT Chatbot</h1>
        <p class="subtitle">Upload a document, select it, and ask questions. Answers come from the selected file.</p>
      </header>

      <section id="controls" class="panel">
        <div class="left">
          <form id="uploadForm" enctype="multipart/form-data">
            <label class="label">Upload file (PDF or TXT)</label>
            <input type="file" id="fileInput" name="file" accept=".pdf,.txt">
            <div class="row">
              <button id="uploadBtn" type="submit" class="btn primary">Upload & Index</button>
              <button id="refreshBtn" type="button" class="btn">Refresh Files</button>
            </div>
          </form>
        </div>

        <div class="right">
          <label class="label">Select uploaded file</label>
          <select id="fileSelect" class="select"></select>
          <div class="row">
            <button id="selectBtn" class="btn primary">Select & Index</button>
            <div id="status" class="status">No document loaded.</div>
          </div>
        </div>
      </section>

      <section id="qa" class="panel">
        <label class="label">Ask a question about the selected file</label>
        <div class="ask-row">
          <input id="question" type="text" placeholder="Type your question here..." class="input-large" autocomplete="off">
          <button id="askBtn" class="btn primary">Ask</button>
        </div>
      </section>

      <section id="output" class="panel">
        <div id="answer" class="answer">No answer yet.</div>
      </section>

      <footer class="footer">
        <small>Tip: If answers seem off, try a more specific question or upload a different file.</small>
      </footer>
    </div>

    <script src="/static/static.js"></script>
  </body>
</html>
